<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>무료 배치표 — 준비 중 · IANUS</title>
<meta name="robots" content="noindex">
<meta name="description" content="야누스 무료 정시 배치표 — 준비 중입니다.">
<style>
  :root{--ink:#1e3550;--body:#3f5570;--muted:#8695a8;--line:#e4eaf1;--bg:#f4f6fa;--gold:#cf9a3a;--blue:#2f6fb3}
  @media (prefers-color-scheme: dark){
    :root{--ink:#e8eef7;--body:#c3d2e6;--muted:#8fa3bc;--line:#2a476b;--bg:#0f1b2b}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--body);
       font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
       line-height:1.65;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  .box{max-width:560px;width:100%;background:transparent}
  .eyebrow{font-size:12px;letter-spacing:.18em;color:var(--muted);margin-bottom:14px}
  h1{margin:0 0 12px;font-size:clamp(24px,4vw,32px);line-height:1.3;color:var(--ink);letter-spacing:-.02em}
  p{margin:0 0 14px;font-size:15px}
  .note{margin-top:22px;padding:14px 16px;border:1px solid var(--line);border-left:3px solid var(--gold);
        border-radius:10px;font-size:13.5px;color:var(--muted)}
  a{color:var(--blue)}
  .foot{margin-top:26px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
  <main class="box">
    <div class="eyebrow">미래를 여는 문 · IANUS</div>
    <h1>무료 정시 배치표는 준비 중입니다</h1>
    <p>수능 이후 공개할 예정입니다. 이 주소는 바뀌지 않으니 그대로 두셔도 됩니다.</p>
    <p><a href="/">야누스 홈으로 →</a></p>

    <div class="note">
      <b>왜 아직 비어 있나요</b><br>
      배치표는 지난 입시 데이터를 바탕으로 만듭니다. 공개 범위에 대한 검토가 끝나기 전에는
      숫자를 내보내지 않습니다. 준비되지 않은 추정치를 먼저 보여드리는 편보다,
      늦더라도 근거를 갖춘 뒤 여는 편이 낫다고 판단했습니다.
    </div>

    <div class="foot">© 2026 IANUS EDU · 이 페이지에는 입시 데이터가 포함되어 있지 않습니다.</div>
  </main>
</body>
</html>
